services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AdminPass123!
      - MSSQL_SA_PASSWORD=AdminPass123!
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
